<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Result Portal</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="box">

<h2>Examination Result</h2>

<table>

<tr>
<td>Registration No.</td>
<td><input type="text" id="reg" placeholder="Enter Registration No."></td>
</tr>

<tr>
<td>Roll No.</td>
<td><input type="text" id="roll" placeholder="Enter Roll No."></td>
</tr>

</table>

<div class="btn">
<button onclick="checkResult()">Display Result</button>
</div>

</div>

<div id="loading">
<div class="loader"></div>
<p>Please wait...</p>
</div>

<script src="script.js"></script>

</body>
</html>
